<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바나나 강화하기 🍌</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game">

    <header>
      <h1>🍌 바나나 강화하기</h1>
      <p>바나나를 강화해서 어디까지 갈 수 있을까?</p>
    </header>

    <div class="status">
      <div>
        💰 <span id="coins">1000</span>
      </div>

      <div>
        🏆 최고 강화 <span id="bestLevel">+0</span>
      </div>
    </div>

    <main>

      <section class="banana-area">

        <div id="banana" class="banana">
          🍌
        </div>

        <h2 id="bananaName">평범한 바나나</h2>

        <div class="level">
          +<span id="level">0</span>
        </div>

        <div class="message" id="message">
          강화를 시작해보세요!
        </div>

      </section>

      <section class="upgrade-area">

        <div class="info">
          <div>
            강화 비용
            <strong>💰 <span id="cost">100</span></strong>
          </div>

          <div>
            성공 확률
            <strong><span id="chance">100</span>%</strong>
          </div>
        </div>

        <button id="upgradeButton">
          ⚡ 강화하기
        </button>

        <button id="resetButton" class="reset">
          처음부터 다시하기
        </button>

      </section>

    </main>

    <footer>
      <p>Banana Upgrade © 2026</p>
    </footer>

  </div>

  <script src="script.js"></script>

</body>
</html>
