<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeRoute AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🛡️ SafeRoute AI</h1>
    <p>실시간 보행로 안전 안내 가이드 AI</p>
  </header>

  <main>
    <section class="card">
      <h2>보행로 위험 안내</h2>
      <p>보행로의 위험 유형을 선택하세요.</p>

      <label for="danger">위험 유형</label>
      <select id="danger">
        <option value="">선택하세요</option>
        <option value="kickboard">공유 킥보드</option>
        <option value="stairs">계단</option>
        <option value="broken">파손된 보도</option>
        <option value="normal">안전한 보행로</option>
      </select>

      <button id="analyzeBtn">위험 분석하기</button>
    </section>

    <section id="result" class="result hidden">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
    </section>
  </main>

  <footer>
    <p>SafeRoute AI © 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
